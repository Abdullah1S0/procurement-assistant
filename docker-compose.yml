# docker compose up -d                      -> mongo + backend (:8000) + frontend (:5173)
# docker compose --profile seed run --rm seed   -> one-time load of data/purchases_clean.csv into MongoDB
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 20

  seed:
    profiles: ["seed"]
    build: ./backend
    command: ["python", "scripts/load_to_mongo.py", "/data/purchases_clean.csv", "--uri", "mongodb://mongo:27017"]
    volumes: [./data:/data:ro]
    depends_on:
      mongo: { condition: service_healthy }

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      MONGO_URI: mongodb://mongo:27017
    ports: ["8000:8000"]
    volumes: [./data/eval_questions.json:/data/eval_questions.json:ro]
    depends_on:
      mongo: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  mongo-data:
